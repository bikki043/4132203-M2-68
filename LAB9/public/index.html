<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCM Professional Push</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        .app-card {
            background: white;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .status-indicator {
            transition: all 0.3s ease;
        }
        .btn-primary {
            background-color: #2563eb;
            transition: all 0.2s ease;
        }
        .btn-primary:hover {
            background-color: #1d4ed8;
        }
        .btn-primary:active {
            transform: scale(0.98);
        }
        .token-area {
            background-color: #f1f5f9;
            border: 1px solid #e2e8f0;
        }
        @keyframes subtle-pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pulse-active {
            animation: subtle-pulse 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="app-card p-8 rounded-2xl max-w-2xl w-full max-h-screen overflow-y-auto">
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 bg-blue-50 rounded-xl mb-4 text-blue-600">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">ระบบแจ้งเตือนข่าวสาร</h1>
            <p class="text-slate-500 text-sm mt-1">Firebase Cloud Messaging Console</p>
        </div>
        
        <!-- Status Panel -->
        <div id="status-container" class="mb-6 p-4 rounded-xl border border-slate-100 flex items-center justify-between bg-slate-50/50">
            <div class="flex items-center gap-3">
                <div id="status-dot" class="w-2.5 h-2.5 rounded-full bg-slate-300"></div>
                <span id="status-text" class="text-sm font-medium text-slate-600">พร้อมเชื่อมต่อระบบ</span>
            </div>
            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Service Status</span>
        </div>

        <!-- Main Action -->
        <button id="btn-permission" class="btn-primary w-full text-white font-semibold py-3.5 px-6 rounded-xl shadow-lg shadow-blue-100 flex items-center justify-center gap-2">
            <span>ลงทะเบียนรับข้อมูล</span>
        </button>

        <!-- Device Information -->
        <div class="mt-8">
            <div class="flex justify-between items-center mb-2.5 px-1">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Device Token</span>
                <button id="btn-copy" class="text-blue-600 text-xs font-bold hover:text-blue-700 hidden transition-colors">คัดลอก</button>
            </div>
            <div class="token-area p-4 rounded-xl relative group">
                <div id="token-display" class="text-[12px] font-mono text-slate-500 break-all leading-relaxed">
                    ยังไม่มีการระบุตัวตนอุปกรณ์
                </div>
            </div>
        </div>

        <!-- Send Notification Section -->
        <div id="send-section" class="mt-8 hidden">
            <div class="mb-3 px-1">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">ส่งข้อความทดสอบ</span>
            </div>
            <div class="bg-blue-50 border border-blue-200 rounded-xl p-5">
                <input id="input-title" type="text" placeholder="ชื่อเรื่อง" class="w-full mb-3 px-4 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-blue-500">
                <textarea id="input-body" placeholder="เนื้อความ" class="w-full mb-3 px-4 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-blue-500 h-24 resize-none"></textarea>
                <button id="btn-send" class="btn-primary w-full text-white font-semibold py-2.5 px-4 rounded-lg text-sm">ส่งข้อความ</button>
            </div>
        </div>

        <!-- Notification History -->
        <div id="notification-history" class="mt-8 hidden animate-in fade-in duration-500">
            <div class="flex items-center gap-2 mb-3">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">ข้อความล่าสุด</span>
            </div>
            <div id="messages-list" class="space-y-3 max-h-64 overflow-y-auto">
                <div class="bg-white border border-blue-100 rounded-xl p-5 shadow-sm">
                    <h4 class="font-bold text-slate-900 text-base mb-1" id="msg-title"></h4>
                    <p class="text-slate-600 text-sm leading-relaxed" id="msg-text">ไม่มีข้อมูล</p>
                    <p class="text-[11px] text-slate-400 mt-2" id="msg-time"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. Firebase Configuration (ใส่ข้อมูลของคุณที่นี่)
        const firebaseConfig = {
            apiKey: "AIzaSyCUq1mw38y6Lc8hn0TZOlLUBWth14YU5sg",
            authDomain: "bunyachon-abb2b.firebaseapp.com",
            projectId: "bunyachon-abb2b",
            storageBucket: "bunyachon-abb2b.firebasestorage.app",
            messagingSenderId: "296149186478",
            appId: "1:296149186478:web:648ce827de3024f2a6fa3f"
        };

        firebase.initializeApp(firebaseConfig);
        const messaging = firebase.messaging();

        // Register Service Worker
        let swReady = false;
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/firebase-messaging-sw.js')
                .then(reg => {
                    console.log('Service Worker registered:', reg);
                    swReady = true;
                })
                .catch(err => {
                    console.warn('Service Worker registration failed:', err);
                });
        }

        const btnPermission = document.getElementById('btn-permission');
        const statusContainer = document.getElementById('status-container');
        const statusText = document.getElementById('status-text');
        const statusDot = document.getElementById('status-dot');
        const tokenDisplay = document.getElementById('token-display');
        const btnCopy = document.getElementById('btn-copy');
        const notificationHistory = document.getElementById('notification-history');
        const msgTitle = document.getElementById('msg-title');
        const msgText = document.getElementById('msg-text');
        const msgTime = document.getElementById('msg-time');
        const sendSection = document.getElementById('send-section');
        const inputTitle = document.getElementById('input-title');
        const inputBody = document.getElementById('input-body');
        const btnSend = document.getElementById('btn-send');
        const messagesList = document.getElementById('messages-list');
        
        let currentToken = null;
        let messageHistory = JSON.parse(localStorage.getItem('messages') || '[]');

        // 2. Permission Handling
        btnPermission.addEventListener('click', async () => {
            btnPermission.innerHTML = '<span class="opacity-70">กำลังตรวจสอบ...</span>';
            btnPermission.disabled = true;
            
            try {
                const permission = await Notification.requestPermission();
                if (permission === 'granted') {
                    getToken();
                } else {
                    updateStatus('ปฏิเสธการเข้าถึง', 'bg-red-500');
                    btnPermission.innerText = 'ถูกปฏิเสธสิทธิ์';
                }
            } catch (err) {
                updateStatus('ข้อผิดพลาดระบบ', 'bg-red-500');
                btnPermission.disabled = false;
                btnPermission.innerText = 'ลองใหม่อีกครั้ง';
            }
        });

        // 3. Token Logic
        function getToken() {
            if (!swReady) {
                updateStatus('Service Worker ยังโหลด', 'bg-amber-500');
                setTimeout(getToken, 1000);
                return;
            }
            
            messaging.getToken({ vapidKey: 'BLBxdAF8jByFUeLzaNwwzVsfgv0mULbFLYoW0mALfk3UynkG48PQ7rXuHa8OhLt5Xi42nPnCltUSEe5HXLo2Omw' })
                .then((token) => {
                    if (token) {
                        currentToken = token;
                        tokenDisplay.innerText = token;
                        btnCopy.classList.remove('hidden');
                        sendSection.classList.remove('hidden');
                        updateStatus('เชื่อมต่อสำเร็จ', 'bg-emerald-500', true);
                        btnPermission.classList.add('hidden');
                        saveTokenToFirestore(token);
                    } else {
                        updateStatus('ไม่พบ Token - ตรวจสอบ Firebase', 'bg-amber-500');
                        btnPermission.disabled = false;
                        btnPermission.innerText = 'ลองใหม่อีกครั้ง';
                    }
                })
                .catch((err) => {
                    console.error('Token Error:', err);
                    updateStatus('ข้อผิดพลาด: ' + err.message, 'bg-red-500');
                    btnPermission.disabled = false;
                    btnPermission.innerText = 'ลองใหม่อีกครั้ง';
                });
        }

        // 4. Foreground Message
        messaging.onMessage((payload) => {
            addMessageToHistory({
                title: payload.notification.title,
                body: payload.notification.body,
                time: new Date()
            });
            
            new Notification(payload.notification.title, {
                body: payload.notification.body,
                icon: 'https://cdn-icons-png.flaticon.com/512/3119/3119338.png'
            });
        });

        // 5. Save Token to Firestore
        function saveTokenToFirestore(token) {
            try {
                if (!firebase.firestore) {
                    console.warn('Firestore SDK not loaded');
                    return;
                }
                
                const db = firebase.firestore();
                if (!db) throw new Error('Firestore not initialized');
                
                const deviceId = 'device-' + new Date().getTime();
                db.collection('tokens').doc(deviceId).set({
                    token: token,
                    registeredAt: firebase.firestore.FieldValue.serverTimestamp(),
                    userAgent: navigator.userAgent
                }).then(() => {
                    console.log('Token saved to Firestore');
                }).catch(err => console.warn('Failed to save token:', err));
            } catch (err) {
                console.warn('Firestore save error:', err);
            }
        }

        // 6. Add Message to History
        function addMessageToHistory(msg) {
            notificationHistory.classList.remove('hidden');
            messageHistory.unshift(msg);
            if (messageHistory.length > 10) messageHistory.pop();
            localStorage.setItem('messages', JSON.stringify(messageHistory));
            renderMessages();
        }

        // 7. Render Messages
        function renderMessages() {
            messagesList.innerHTML = messageHistory.map((msg, idx) => `
                <div class="bg-white border border-blue-100 rounded-xl p-5 shadow-sm">
                    <h4 class="font-bold text-slate-900 text-base mb-1">${escapeHtml(msg.title)}</h4>
                    <p class="text-slate-600 text-sm leading-relaxed">${escapeHtml(msg.body)}</p>
                    <p class="text-[11px] text-slate-400 mt-2">${new Date(msg.time).toLocaleString('th-TH')}</p>
                </div>
            `).join('');
        }

        // 8. Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 9. Send Notification - Write to Firestore
        btnSend.addEventListener('click', async () => {
            const title = inputTitle.value.trim();
            const body = inputBody.value.trim();
            
            if (!title || !body) {
                alert('กรุณากรอกข้อมูล');
                return;
            }
            
            btnSend.disabled = true;
            btnSend.innerText = 'กำลังส่ง...';
            
            try {
                // Make sure Firestore is available
                if (!firebase.firestore) {
                    throw new Error('Firestore SDK not loaded');
                }
                
                const db = firebase.firestore();
                if (!db) throw new Error('Firestore not initialized');
                
                console.log('Saving to Firestore...');
                
                // Save to notifications collection
                const docRef = await db.collection('notifications').add({
                    title: title,
                    body: body,
                    token: currentToken,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                console.log('Saved with ID:', docRef.id);
                
                addMessageToHistory({ title, body, time: new Date() });
                inputTitle.value = '';
                inputBody.value = '';
                alert('บันทึกข้อความสำเร็จ');
            } catch (err) {
                console.error('Save error:', err);
                alert('เกิดข้อผิดพลาด: ' + err.message);
            } finally {
                btnSend.disabled = false;
                btnSend.innerText = 'ส่งข้อความ';
            }
        });

        // 10. Initialize message history
        renderMessages();

        function updateStatus(text, dotColor, isActive = false) {
            statusText.innerText = text;
            statusDot.className = `w-2.5 h-2.5 rounded-full ${dotColor} ${isActive ? 'pulse-active' : ''}`;
            if (isActive) {
                statusContainer.classList.remove('bg-slate-50/50');
                statusContainer.classList.add('bg-emerald-50/30');
                statusText.classList.remove('text-slate-600');
                statusText.classList.add('text-emerald-700');
            }
        }

        // Action: Copy
        btnCopy.addEventListener('click', () => {
            const text = tokenDisplay.innerText;
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            btnCopy.innerText = 'คัดลอกแล้ว';
            setTimeout(() => btnCopy.innerText = 'คัดลอก', 2000);
        });
    </script>
</body>
</html>
